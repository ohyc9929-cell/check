<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 체크리스트</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            color-scheme: dark;
            --page-background: #111827;
            --text-color: #f3f4f6;
            --muted-text: #a1a1aa;
            --card-background: #1f2937;
            --border-color: #374151;
            --progress-track: #374151;
            --completed-text: #9ca3af;
            --toggle-background: #1f2937;
            --toggle-text: #f3f4f6;
            --open-background: #1e3a5f;
            --middle-background: #4a3b20;
            --close-background: #3b2b52;
            --card-shadow: 0 3px 12px rgba(0,0,0,0.2);
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans KR", sans-serif;
            background: var(--page-background);
            color: var(--text-color);
        }

        .top-button {
            position: fixed;
            top: 16px;
            z-index: 1;
            width: auto;
            flex: none;
            padding: 10px 14px;
            background: #374151;
            color: #f9fafb;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .employee-button {
            left: 16px;
            max-width: 42vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .admin-button {
            right: 16px;
        }

        dialog {
            width: min(420px, calc(100% - 32px));
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 24px;
            background: var(--card-background);
            color: var(--text-color);
            box-shadow: var(--card-shadow);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.65);
        }

        .dialog-form {
            display: grid;
            gap: 14px;
        }

        .dialog-form h2 {
            margin: 0;
        }

        .dialog-form input,
        .admin-add-form input {
            min-width: 0;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #111827;
            color: var(--text-color);
            font-size: 16px;
        }

        .dialog-actions {
            display: flex;
            gap: 10px;
        }

        .dialog-actions button {
            flex: 1;
        }

        .cancel-button {
            background: #4b5563;
            color: white;
        }

        .admin-add-form {
            display: flex;
            gap: 8px;
            padding: 8px 0;
        }

        .admin-add-form[hidden] {
            display: none;
        }

        .admin-add-form input {
            flex: 1;
        }

        .add-task-button {
            flex: none;
            padding: 10px 14px;
            background: #4f46e5;
            color: white;
        }

        .task-delete-button {
            flex: none;
            padding: 8px 10px;
            background: #b91c1c;
            color: white;
            font-size: 14px;
        }

        .task input:disabled {
            cursor: not-allowed;
        }

        .task.locked {
            cursor: not-allowed;
            opacity: 0.82;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 25px 15px 50px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .date {
            text-align: center;
            color: var(--muted-text);
            margin-bottom: 25px;
        }

        .sync-status {
            text-align: center;
            color: var(--muted-text);
            font-size: 14px;
            margin: -16px 0 20px;
        }

        .sync-status[data-state="connected"] {
            color: #15803d;
        }

        .sync-status[data-state="error"] {
            color: #dc2626;
        }

        /* 진행률 */
        .progress-box {
            background: var(--card-background);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--progress-track);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: #4f46e5;
            transition: 0.3s;
        }

        /* 조별 카드 */
        .group {
            background: var(--card-background);
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        .group-header {
            padding: 18px 20px;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
        }

        .open {
            background: var(--open-background);
        }

        .middle {
            background: var(--middle-background);
        }

        .close {
            background: var(--close-background);
        }

        .task-list {
            padding: 10px 20px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 5px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .task:last-child {
            border-bottom: none;
        }

        .task input {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        .task span {
            font-size: 16px;
            flex: 1;
        }

        .task.completed span {
            text-decoration: line-through;
            color: var(--completed-text);
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px 10px 30px;
            }

            .top-button {
                top: 10px;
                padding: 8px 10px;
                font-size: 14px;
            }

            .employee-button {
                left: 10px;
            }

            .admin-button {
                right: 10px;
            }

            h1 {
                margin-top: 52px;
                font-size: 25px;
            }

            .group-header {
                font-size: 20px;
            }

            .task span {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

<button class="top-button employee-button" id="employeeButton" type="button">알바생</button>
<button class="top-button admin-button" id="adminButton" type="button">관리자 로그인</button>

<div class="container">

    <h1>📝 업무 체크리스트</h1>

    <div class="date" id="today"></div>
    <div class="sync-status" id="syncStatus" role="status" aria-live="polite">
        공유 서버 연결 중...
    </div>

    <!-- 진행률 -->
    <div class="progress-box">

        <div class="progress-text">
            <span>오늘 전체 진행률</span>
            <span id="progressText">0 / 0</span>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progressBar"></div>
        </div>

    </div>


    <!-- 오픈 -->
    <div class="group" data-group="open">

        <div class="group-header open">
            🌅 오픈조
        </div>

        <div class="task-list"></div>
        <form class="admin-add-form" data-group="open" hidden>
            <input type="text" maxlength="80" placeholder="새 오픈조 업무" aria-label="새 오픈조 업무">
            <button class="add-task-button" type="submit">추가</button>
        </form>
    </div>


    <!-- 미들 -->
    <div class="group" data-group="middle">

        <div class="group-header middle">
            ☀️ 미들조
        </div>

        <div class="task-list"></div>
        <form class="admin-add-form" data-group="middle" hidden>
            <input type="text" maxlength="80" placeholder="새 미들조 업무" aria-label="새 미들조 업무">
            <button class="add-task-button" type="submit">추가</button>
        </form>
    </div>


    <!-- 마감 -->
    <div class="group" data-group="close">

        <div class="group-header close">
            🌙 마감조
        </div>

        <div class="task-list"></div>
        <form class="admin-add-form" data-group="close" hidden>
            <input type="text" maxlength="80" placeholder="새 마감조 업무" aria-label="새 마감조 업무">
            <button class="add-task-button" type="submit">추가</button>
        </form>
    </div>

</div>

<dialog id="employeeDialog">
    <form class="dialog-form" id="employeeForm">
        <h2>알바생 이름 입력</h2>
        <label for="employeeNameInput">이름</label>
        <input id="employeeNameInput" name="name" type="text" maxlength="40" autocomplete="name" required>
        <div class="dialog-actions">
            <button class="cancel-button" type="button" data-close-dialog="employeeDialog">취소</button>
            <button type="submit">확인</button>
        </div>
    </form>
</dialog>

<dialog id="adminDialog">
    <form class="dialog-form" id="adminForm">
        <h2>관리자 로그인</h2>
        <label for="adminPasswordInput">비밀번호</label>
        <input id="adminPasswordInput" name="password" type="password" inputmode="numeric" autocomplete="current-password" required>
        <div class="dialog-actions">
            <button class="cancel-button" type="button" data-close-dialog="adminDialog">취소</button>
            <button type="submit">로그인</button>
        </div>
        <div class="sync-status" id="adminLoginStatus" role="status" aria-live="polite"></div>
    </form>
</dialog>


<script>
    const syncStatus = document.getElementById("syncStatus");
    const employeeButton = document.getElementById("employeeButton");
    const adminButton = document.getElementById("adminButton");
    const employeeDialog = document.getElementById("employeeDialog");
    const adminDialog = document.getElementById("adminDialog");
    const employeeForm = document.getElementById("employeeForm");
    const adminForm = document.getElementById("adminForm");
    const adminLoginStatus = document.getElementById("adminLoginStatus");
    const groupElements = new Map(
        [...document.querySelectorAll(".group[data-group]")]
            .map(element => [element.dataset.group, element])
    );
    const groupNames = {
        open: "오픈조",
        middle: "미들조",
        close: "마감조"
    };
    const today = new Date();
    let employeeName = sessionStorage.getItem("checklistEmployeeName") || "";
    let adminAuthenticated = false;
    let tasks = [];
    let taskStructure = "";
    let pendingWrites = 0;
    let refreshInProgress = false;
    let writeQueue = Promise.resolve();

    document.getElementById("today").textContent =
        today.getFullYear() + "년 " +
        (today.getMonth() + 1) + "월 " +
        today.getDate() + "일";

    function setSyncStatus(message, state) {
        syncStatus.textContent = message;
        syncStatus.dataset.state = state;
    }

    function updateProgress() {
        const completed = tasks.filter(task => task.checked).length;
        const total = tasks.length;
        const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);

        document.getElementById("progressText").textContent =
            completed + " / " + total + " (" + percentage + "%)";
        document.getElementById("progressBar").style.width = percentage + "%";
    }

    function updateEmployeeControls() {
        employeeButton.textContent = employeeName
            ? "알바생: " + employeeName
            : "알바생";

        document.querySelectorAll(".task-checkbox").forEach(checkbox => {
            checkbox.disabled = !employeeName;
            checkbox.closest(".task").classList.toggle("locked", !employeeName);
        });
    }

    function updateAdminControls() {
        adminButton.textContent = adminAuthenticated ? "관리자 로그아웃" : "관리자 로그인";

        document.querySelectorAll(".admin-add-form").forEach(form => {
            form.hidden = !adminAuthenticated;
        });

        renderTasks();
    }

    function renderTasks() {
        const nextStructure = JSON.stringify(
            tasks.map(({ id, group, title }) => ({ id, group, title }))
        );

        if (taskStructure !== nextStructure) {
            for (const [group, element] of groupElements) {
                const list = element.querySelector(".task-list");
                list.replaceChildren();

                for (const task of tasks.filter(item => item.group === group)) {
                    const row = document.createElement("div");
                    row.className = "task";

                    const checkbox = document.createElement("input");
                    checkbox.className = "task-checkbox";
                    checkbox.type = "checkbox";
                    checkbox.checked = task.checked;
                    checkbox.disabled = !employeeName;
                    checkbox.dataset.taskId = task.id;
                    checkbox.addEventListener("change", () => {
                        task.checked = checkbox.checked;
                        row.classList.toggle("completed", checkbox.checked);
                        updateProgress();
                        saveTask(task);
                    });

                    const title = document.createElement("span");
                    title.textContent = task.title;

                    row.classList.toggle("completed", task.checked);
                    row.classList.toggle("locked", !employeeName);
                    row.append(checkbox, title);

                    if (adminAuthenticated) {
                        const removeButton = document.createElement("button");
                        removeButton.className = "task-delete-button";
                        removeButton.type = "button";
                        removeButton.textContent = "삭제";
                        removeButton.setAttribute("aria-label", task.title + " 삭제");
                        removeButton.addEventListener("click", () => deleteTask(task));
                        row.append(removeButton);
                    }

                    list.append(row);
                }
            }

            taskStructure = nextStructure;
        } else {
            for (const checkbox of document.querySelectorAll(".task-checkbox")) {
                const task = tasks.find(item => item.id === checkbox.dataset.taskId);
                if (!task) continue;

                checkbox.checked = task.checked;
                checkbox.disabled = !employeeName;
                checkbox.closest(".task").classList.toggle("completed", task.checked);
                checkbox.closest(".task").classList.toggle("locked", !employeeName);
            }
        }

        updateProgress();
    }

    async function requestJson(url, options = {}) {
        const response = await fetch(url, {
            cache: "no-store",
            ...options,
            headers: {
                ...(options.body ? { "Content-Type": "application/json" } : {}),
                ...options.headers
            }
        });
        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "요청을 완료하지 못했습니다.");
        }

        return result;
    }

    async function refreshSharedTasks() {
        if (refreshInProgress) return;

        refreshInProgress = true;

        try {
            const result = await requestJson("/api/state");
            adminAuthenticated = result.admin === true;

            if (pendingWrites === 0) {
                if (!Array.isArray(result.tasks)) {
                    throw new Error("공유 데이터 형식이 올바르지 않습니다.");
                }

                tasks = result.tasks.map(task => ({
                    id: task.id,
                    group: task.group,
                    title: task.title,
                    checked: task.checked === true
                }));
                updateAdminControls();
                updateEmployeeControls();
                setSyncStatus("모든 방문자와 실시간 공유 중", "connected");
            }
        } catch (error) {
            console.error("공유 체크리스트 동기화에 실패했습니다.", error);
            setSyncStatus(error.message + " 다시 연결을 시도합니다.", "error");
        } finally {
            refreshInProgress = false;
        }
    }

    function saveTask(task) {
        if (!employeeName) {
            setSyncStatus("먼저 알바생 이름을 입력해 주세요.", "error");
            return;
        }

        pendingWrites++;
        setSyncStatus("변경사항 저장 중...", "syncing");

        const request = writeQueue.then(() => requestJson("/api/state", {
            method: "POST",
            body: JSON.stringify({
                id: task.id,
                checked: task.checked,
                employeeName
            })
        }));

        writeQueue = request.then(
            () => {
                pendingWrites--;
                if (pendingWrites === 0) {
                    setSyncStatus("모든 방문자와 실시간 공유 중", "connected");
                }
            },
            error => {
                pendingWrites--;
                console.error("공유 체크리스트 저장에 실패했습니다.", error);
                setSyncStatus(error.message + " 다시 연결을 시도합니다.", "error");
                refreshSharedTasks();
            }
        );
    }

    async function deleteTask(task) {
        if (!adminAuthenticated || !confirm(`"${task.title}" 항목을 삭제할까요?`)) return;

        try {
            await requestJson("/api/admin/tasks", {
                method: "DELETE",
                body: JSON.stringify({ id: task.id })
            });
            await refreshSharedTasks();
        } catch (error) {
            setSyncStatus(error.message, "error");
        }
    }

    document.querySelectorAll(".admin-add-form").forEach(form => {
        form.addEventListener("submit", async event => {
            event.preventDefault();
            if (!adminAuthenticated) return;

            const input = form.querySelector("input");
            const title = input.value.trim();
            if (!title) return;

            try {
                await requestJson("/api/admin/tasks", {
                    method: "POST",
                    body: JSON.stringify({
                        group: form.dataset.group,
                        title
                    })
                });
                input.value = "";
                await refreshSharedTasks();
            } catch (error) {
                setSyncStatus(error.message, "error");
            }
        });
    });

    employeeButton.addEventListener("click", () => {
        document.getElementById("employeeNameInput").value = employeeName;
        employeeDialog.showModal();
    });

    employeeForm.addEventListener("submit", event => {
        event.preventDefault();
        const name = document.getElementById("employeeNameInput").value.trim();
        if (!name) return;

        employeeName = name.slice(0, 40);
        sessionStorage.setItem("checklistEmployeeName", employeeName);
        updateEmployeeControls();
        employeeDialog.close();
    });

    adminButton.addEventListener("click", async () => {
        if (!adminAuthenticated) {
            adminLoginStatus.textContent = "";
            document.getElementById("adminPasswordInput").value = "";
            adminDialog.showModal();
            return;
        }

        try {
            await requestJson("/api/admin/session", { method: "DELETE" });
            adminAuthenticated = false;
            taskStructure = "";
            updateAdminControls();
            adminButton.textContent = "관리자 로그인";
        } catch (error) {
            setSyncStatus(error.message, "error");
        }
    });

    adminForm.addEventListener("submit", async event => {
        event.preventDefault();
        const password = document.getElementById("adminPasswordInput").value;
        const submitButton = adminForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        adminLoginStatus.textContent = "로그인 확인 중...";

        try {
            await requestJson("/api/admin/session", {
                method: "POST",
                body: JSON.stringify({ password })
            });
            adminAuthenticated = true;
            adminDialog.close();
            taskStructure = "";
            await refreshSharedTasks();
        } catch (error) {
            adminLoginStatus.textContent = error.message;
        } finally {
            submitButton.disabled = false;
        }
    });

    document.querySelectorAll("[data-close-dialog]").forEach(button => {
        button.addEventListener("click", () => {
            document.getElementById(button.dataset.closeDialog).close();
        });
    });

    updateEmployeeControls();
    refreshSharedTasks();
    setInterval(refreshSharedTasks, 2000);
</script>

</body>
</html>
